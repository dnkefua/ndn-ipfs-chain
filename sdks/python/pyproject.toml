[project]
name = "ndn-ipfs"
version = "1.0.0"
description = "NDN IPFS Chain — the easiest way to build on IPFS."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "NDN Analytics", email = "support@ndnanalytics.com" }]
keywords = ["ipfs", "filecoin", "web3", "storage", "pinning", "decentralized"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving",
]
dependencies = [
  "httpx>=0.27",
  "cryptography>=42",
  "multiformats>=0.3",
  "pydantic>=2.7",
]

[project.optional-dependencies]
async = ["anyio>=4.3"]
cli = ["typer>=0.12", "rich>=13.7"]

[project.scripts]
ndn = "ndn_ipfs.cli:app"

[project.urls]
Homepage      = "https://docs.ndnipfs.com"
Documentation = "https://docs.ndnipfs.com/python"
Repository    = "https://github.com/ndn-analytics/ipfs-chain"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ndn_ipfs"]

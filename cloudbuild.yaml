# Google Cloud Build Configuration
# Automatically builds and deploys NDN IPFS Chain Dashboard to Cloud Run 

steps:
  # Build Dashboard image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-dashboard'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/ndn-ipfs-chain-493611/ndn-ipfs/ndn-dashboard:latest'
      - 'dashboard/'
    env:
      - 'DOCKER_BUILDKIT=1'

  # Push Dashboard image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-dashboard'
    args:
      - 'push'
      - 'gcr.io/ndn-ipfs-chain-493611/ndn-ipfs/ndn-dashboard:latest'

# Images to push to Artifact Registry
images:
  - 'gcr.io/ndn-ipfs-chain-493611/ndn-ipfs/ndn-dashboard:latest'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Timeout for entire build (30 minutes)
timeout: '1800s'

# Or trigger manually:
# gcloud builds submit --config cloudbuild.yaml

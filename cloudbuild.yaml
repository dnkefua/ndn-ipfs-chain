# Google Cloud Build Configuration
# Builds and deploys NDN IPFS Chain API and Dashboard to Cloud Run

# Note: COMMIT_SHA must be provided via --substitutions=COMMIT_SHA=$(git rev-parse --short HEAD)
# or via a Cloud Build trigger which provides it automatically

steps:
  # Build API Server image (build context is repo root, Dockerfile path is relative)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-api:${COMMIT_SHA}'
      - '-t'
      - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-api:latest'
      - '-f'
      - 'api/server/Dockerfile'
      - 'api/server'
      - '--build-arg'
      - 'NODE_ENV=production'

  # Push API Server image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-api:${COMMIT_SHA}'

  # Build Dashboard image (build context is repo root, Dockerfile path is relative)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-dashboard'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-dashboard:${COMMIT_SHA}'
      - '-t'
      - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-dashboard:latest'
      - '-f'
      - 'dashboard/Dockerfile'
      - 'dashboard'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://ndn-api-1037328355027.us-west1.run.app'

  # Push Dashboard image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-dashboard'
    args:
      - 'push'
      - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-dashboard:${COMMIT_SHA}'

  # Deploy API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ndn-ipfs-api'
      - '--image'
      - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-api:${COMMIT_SHA}'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--set-env-vars'
      - 'NODE_ENV=production,LOG_LEVEL=info'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,CLUSTER_AUTH=CLUSTER_AUTH:latest,REDIS_URL=REDIS_URL:latest'
      - '--cpu'
      - '2'
      - '--memory'
      - '4Gi'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'

  # Deploy Dashboard to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-dashboard'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ndn-dashboard'
      - '--image'
      - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-dashboard:${COMMIT_SHA}'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_API_URL=https://ndn-api-1037328355027.us-west1.run.app,NODE_ENV=production'
      - '--cpu'
      - '1'
      - '--memory'
      - '2Gi'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '60'

# Images to push to Artifact Registry
images:
  - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-api:${COMMIT_SHA}'
  - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-api:latest'
  - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-dashboard:${COMMIT_SHA}'
  - 'us-west1-docker.pkg.dev/ndn-ipfs-chain-493611/ndn-ipfs/ndn-dashboard:latest'

# Build options
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Timeout for entire build (30 minutes)
timeout: '1800s'

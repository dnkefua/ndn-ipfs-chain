apiVersion: apps/v1
kind: Deployment
metadata:
  name: ndn-gateway
  namespace: ndn-ipfs
  labels: { app: ndn-gateway }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: ndn-gateway } }
  template:
    metadata:
      labels: { app: ndn-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9090"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: ndn-gateway } }
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: gateway
          image: ghcr.io/ndn-analytics/ipfs-gateway:1.0.0
          ports:
            - { name: http,    containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          env:
            - { name: REGION,          valueFrom: { fieldRef: { fieldPath: metadata.labels['topology.kubernetes.io/region'] } } }
            - { name: KUBO_API_URL,    value: "http://kubo.ndn-ipfs.svc.cluster.local:5001" }
            - { name: CLUSTER_API_URL, value: "http://cluster.ndn-ipfs.svc.cluster.local:9094" }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 15 }
          resources:
            requests: { cpu: "500m",  memory: "512Mi" }
            limits:   { cpu: "2000m", memory: "2Gi"   }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ndn-gateway
  namespace: ndn-ipfs
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ndn-gateway }
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Pods
      pods:
        metric: { name: http_requests_per_second }
        target: { type: AverageValue, averageValue: "500" }
---
apiVersion: v1
kind: Service
metadata: { name: ndn-gateway, namespace: ndn-ipfs }
spec:
  type: ClusterIP
  selector: { app: ndn-gateway }
  ports:
    - { name: http, port: 80, targetPort: 8080 }

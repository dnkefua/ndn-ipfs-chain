# Builds the Next.js dashboard image and pushes it to Artifact Registry.
# Usage: gcloud builds submit --config=cloudbuild-dashboard.yaml .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-west1-docker.pkg.dev/$PROJECT_ID/ndn-ipfs/ndn-dashboard:latest'
      - '-f'
      - 'dashboard/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://ndn-api-1037328355027.us-west1.run.app'
      - '.'

images:
  - 'us-west1-docker.pkg.dev/$PROJECT_ID/ndn-ipfs/ndn-dashboard:latest'

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
